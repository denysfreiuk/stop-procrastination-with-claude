[project]
name = "discipline-bot"
version = "0.1.0"
description = "Telegram bot for quick journal entries in an Obsidian vault"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8,<23",
    "tzdata>=2025.2",
]

[project.scripts]
discipline-bot = "discipline_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discipline_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
